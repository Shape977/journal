<!doctype html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.summary | default: site.description | escape }}">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
  <link rel="stylesheet" href="{{ '/assets/journal.css' | relative_url }}?v=2">
</head>
<body>
  <header class="site-header shell">
    <a class="site-link" href="{{ '/' | relative_url }}">日志首页</a>
  </header>
  <main class="shell">
    {{ content }}
  </main>
</body>
</html>
